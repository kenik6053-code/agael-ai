<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agael AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
max-width:700px;
}

h1{
font-size:60px;
margin-bottom:20px;
}

p{
font-size:20px;
margin-bottom:30px;
color:#cbd5e1;
}

button{
padding:15px 35px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#status{
margin-top:25px;
font-size:18px;
color:#22c55e;
}
</style>

</head>

<body>

<div class="container">

<h1>🤖 Agael AI</h1>

<p>The AI Platform Built in Kenya for Africa</p>

<button onclick="connectAPI()">Connect Backend</button>

<div id="status"></div>

</div>

<script>
async function connectAPI(){

try{

const response=await fetch("http://127.0.0.1:8000/");

const data=await response.json();

document.getElementById("status").innerHTML=data.message;

}catch{

document.getElementById("status").innerHTML="❌ Backend not running.";

}

}
</script>

</body>
</html>
